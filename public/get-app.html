<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download the Nkeanyi App | Aba Power</title>
    <meta name="description"
        content="Pay bills instantly, check arrears with ease, view map refunds and more with the Nkeanyi App." />
    <meta name="theme-color" content="#0072CE" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0072ce 0%, #005fb3 45%, #071e3d 100%);
            color: #f8fafc;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 32px 26px;
            text-align: center;
            box-shadow: 0 30px 80px -30px rgba(2, 12, 27, 0.85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #f5b800;
            border: 1px solid rgba(245, 184, 0, 0.4);
            background: rgba(0, 0, 0, 0.25);
            border-radius: 999px;
            padding: 6px 14px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 10px;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .msg {
            margin: 0 0 22px;
            font-size: 14px;
            color: rgba(248, 250, 252, 0.82);
        }

        a.btn {
            display: block;
            text-decoration: none;
            border-radius: 14px;
            padding: 15px 18px;
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 12px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        a.btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #f5b800;
            color: #0b2a4a;
        }

        .btn-primary:hover {
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .hint {
            font-size: 12px;
            line-height: 1.6;
            color: rgba(248, 250, 252, 0.58);
            margin: 20px 0 0;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(248, 250, 252, 0.62);
            text-decoration: none;
        }

        .back:hover {
            color: #f5b800;
        }
    </style>
</head>

<body>
    <main class="card">
        <span class="badge">Official APL Electric App</span>
        <h1>Download the Nkeanyi App</h1>
        <p class="msg" id="msg">Detecting your device&hellip;</p>

        <div id="buttons" hidden>
            <a id="playBtn" class="btn btn-primary" href="#" rel="noopener">Get it on Google Play</a>
            <a id="iosBtn" class="btn btn-secondary" href="#" rel="noopener">Download on the App Store</a>
        </div>

        <p class="hint">
            Pay bills instantly, check arrears with ease, view map refunds and more.
        </p>
        <a class="back" href=".">&larr; Back to abapower.com</a>
    </main>

    <script>
        (function () {
            var PLAY =
                'https://play.google.com/store/apps/details?id=com.aple.customer&pcampaignid=web_share';
            var IOS = 'https://apps.apple.com/ng/app/abapower-nkeanyi/id6795852912';

            var ua = (navigator.userAgent || '').toLowerCase();
            var platform = (navigator.platform || '').toLowerCase();
            var touch = navigator.maxTouchPoints || 0;

            var isIOS =
                /iphone|ipad|ipod/.test(ua) || (platform === 'macintel' && touch > 1);
            var isAndroid = /android/.test(ua);

            var playBtn = document.getElementById('playBtn');
            var iosBtn = document.getElementById('iosBtn');
            var msg = document.getElementById('msg');
            var buttons = document.getElementById('buttons');

            // Carry any iOS StoreKit campaign params (e.g. ?ct=qr) through to
            // the App Store link so installs can be attributed.
            if (isIOS && window.location.search && IOS.indexOf('?') === -1) {
                IOS += window.location.search;
            }

            playBtn.href = PLAY;
            iosBtn.href = IOS;
            // Always expose the manual buttons, even while auto-redirecting, so
            // an in-app browser that blocks the redirect still lets the visitor
            // through with one tap.
            buttons.hidden = false;

            // Keep "Back to abapower.com" working under a sub-path deployment.
            var back = document.querySelector('.back');
            if (back) {
                back.href =
                    window.location.pathname.replace(/get-app\.html$/, '') || '/';
            }

            if (isAndroid) {
                msg.textContent = 'Opening Google Play\u2026';

                // Try the native Play Store via an intent:// URL first; if no
                // app handles it (or the browser blocks it) fall back to the
                // web listing so the visitor always lands somewhere useful.
                var intent =
                    'intent://details?id=com.aple.customer#Intent;scheme=market;action=android.intent.action.VIEW;package=com.android.vending;end';
                var launchedFallback = false;
                var timer = setTimeout(function () {
                    launchedFallback = true;
                    window.location.href = PLAY;
                }, 1500);

                // If the intent worked, the tab is hidden before the timer fires.
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden && !launchedFallback) {
                        clearTimeout(timer);
                    }
                });

                try {
                    window.location.href = intent;
                } catch (err) {
                    clearTimeout(timer);
                    window.location.href = PLAY;
                }
                return;
            }

            if (isIOS) {
                msg.textContent = 'Opening the App Store\u2026';
                window.location.replace(IOS);
                return;
            }

            msg.textContent = 'Choose your app store below.';
        })();
    </script>
</body>

</html>
